# Single-replica by design: the app writes to a SQLite file on a
# ReadWriteOnce PersistentVolumeClaim (see pvc.yaml). Two pods must never
# hold that PVC at once, and better-sqlite3 is single-writer, so this stays
# at replicas: 1 with a Recreate rollout strategy (stop the old pod fully
# before starting the new one) rather than RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raidschedule
  namespace: raidschedule
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: raidschedule
  template:
    metadata:
      labels:
        app: raidschedule
    spec:
      # The PVC mounts owned by root; the image runs as the non-root `node`
      # user (uid/gid 1000). fsGroup makes kubelet chown the mounted volume
      # to that group on attach so the container can write the SQLite file.
      securityContext:
        fsGroup: 1000
      containers:
        - name: raidschedule
          image: us-central1-docker.pkg.dev/raidschedule/raidschedule/raidschedule:v2
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: DB_PATH
              value: /data/raidschedule.db
          envFrom:
            - secretRef:
                name: raidschedule-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: raidschedule-data
