<!DOCTYPE html><html><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Panel, SectionHeading, Button } = window.ZerpyDesignSystem_203cea;
function Card() {
  return (
    <div className="col" style={{gap:18}}>
      <SectionHeading eyebrow="This tier" title="Attendance" description="Counts every character signed to a Tuesday or Friday lockout." action={<Button size="sm">Export</Button>} />
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        <Panel elevation="flat" padding="var(--zp-space-4)"><span className="mi">flat · no blur</span><div style={{font:'var(--zp-text-sm)',color:'var(--zp-text-3)',marginTop:6}}>A row inside a panel.</div></Panel>
        <Panel padding="var(--zp-space-4)"><span className="mi">panel · 14px blur</span><div style={{font:'var(--zp-text-sm)',color:'var(--zp-text-3)',marginTop:6}}>A section on the page.</div></Panel>
        <Panel elevation="overlay" padding="var(--zp-space-4)"><span className="mi">overlay · 22px blur</span><div style={{font:'var(--zp-text-sm)',color:'var(--zp-text-3)',marginTop:6}}>Above everything.</div></Panel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
