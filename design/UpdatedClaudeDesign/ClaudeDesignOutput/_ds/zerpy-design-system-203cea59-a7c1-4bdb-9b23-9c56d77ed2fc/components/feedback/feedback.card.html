<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{margin:0}body{padding:18px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Toast, Tooltip, Popover, EmptyState, Panel, Button, IconButton } = window.ZerpyDesignSystem_203cea;
function Card() {
  const [open, setOpen] = React.useState(true);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
      <div className="col" style={{gap:16}}>
        <Toast tone="success" title="Event published" body="20 members notified" onDismiss={()=>{}} />
        <div className="row" style={{gap:16,paddingTop:34}}>
          <Tooltip content="Copy last week across"><IconButton label="Copy week">⋯</IconButton></Tooltip>
          <span className="mi">Hover the glyph</span>
        </div>
        <div style={{position:'relative',height:150}}>
          <IconButton label="More" onClick={()=>setOpen(!open)}>⋯</IconButton>
          <Popover open={open} onClose={()=>setOpen(false)} items={[{label:'Duplicate'},{label:'Copy week across'},{label:'Delete event',tone:'danger'}]} />
        </div>
      </div>
      <EmptyState glyph="—" title="No events in this range" body="Right-click any day to schedule a raid, or jump back to today." action={<Button>Back to today</Button>} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
