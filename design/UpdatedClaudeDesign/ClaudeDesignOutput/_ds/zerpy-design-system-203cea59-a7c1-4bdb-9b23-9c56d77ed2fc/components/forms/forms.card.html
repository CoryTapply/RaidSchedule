<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Switch, Checkbox, Radio, SegmentedControl } = window.ZerpyDesignSystem_203cea;
function Card() {
  const [f, setF] = React.useState('Week');
  const [on, setOn] = React.useState(true);
  const [box, setBox] = React.useState(true);
  const [pick, setPick] = React.useState('heroic');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div className="col">
        <Field label="Event title" hint="Shown on the calendar block."><Input placeholder="Nerub-ar Palace" /></Field>
        <Field label="Roster size" error="Mythic is capped at 20."><Input invalid defaultValue="24" /></Field>
        <Field label="Class"><Select options={['Druid','Hunter','Shaman','Warrior']} /></Field>
        <Field label="Notes"><Textarea rows={2} placeholder="Bring flasks." style={{minHeight:56}} /></Field>
      </div>
      <div className="col">
        <Field label="View"><SegmentedControl options={['Day','Week','Month']} value={f} onChange={setF} /></Field>
        <Switch checked={on} onChange={setOn} label="Raid reminders" description="Ping an hour before pull." />
        <div className="col" style={{gap:8}}>
          <Checkbox checked={box} onChange={setBox} label="Marks capped" />
          <Checkbox checked={false} label="Attuned" />
          <Radio checked={pick==='normal'} onChange={()=>setPick('normal')} label="Normal" />
          <Radio checked={pick==='heroic'} onChange={()=>setPick('heroic')} label="Heroic" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
