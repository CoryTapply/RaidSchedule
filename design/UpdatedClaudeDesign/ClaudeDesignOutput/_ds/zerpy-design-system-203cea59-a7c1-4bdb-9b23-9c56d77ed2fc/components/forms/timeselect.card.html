<!-- @dsCard group="Components" viewport="700x330" name="TimeSelect" subtitle="Masked h:mm AM/PM field with preset times, paired start and end" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>TimeSelect</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.col{display:flex;flex-direction:column;gap:12px}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Field, TimeSelect } = window.ZerpyDesignSystem_203cea;
const fmt = v => { if (v == null) return '--'; const h = Math.floor(v/60), m = v%60; return ((h%12)||12) + ':' + (m<10?'0'+m:m) + ' ' + (h<12?'AM':'PM'); };
function Card() {
  const [start, setStart] = React.useState(1200);
  const [end, setEnd] = React.useState(1380);
  const [rem, setRem] = React.useState(null);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div className="col">
        <span className="mi">Raid window</span>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Field label="Start"><TimeSelect value={start} onChange={setStart} aria-label="Start time" /></Field>
          <Field label="End"><TimeSelect value={end} onChange={setEnd} relativeTo={start} align="end" aria-label="End time" /></Field>
        </div>
        <span style={{font:'var(--zp-text-sm)',color:'var(--zp-text-3)'}}>{fmt(start)} – {fmt(end)}</span>
      </div>
      <div className="col">
        <span className="mi">States</span>
        <Field label="Reminder" hint="Type 9 3 0 p — segments advance on their own."><TimeSelect value={rem} onChange={setRem} aria-label="Reminder time" /></Field>
        <Field label="Invalid" error="Outside the raid window."><TimeSelect invalid value={330} onChange={()=>{}} aria-label="Invalid time" /></Field>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Field label="Read only"><TimeSelect readOnly value={1140} onChange={()=>{}} aria-label="Locked time" /></Field>
          <Field label="Disabled"><TimeSelect disabled value={null} onChange={()=>{}} aria-label="Disabled time" /></Field>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
