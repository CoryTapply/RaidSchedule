<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}
body{width:1280px;height:854px;display:flex;overflow:hidden;background:var(--zp-bg)}
.main{flex:1;display:flex;align-items:center;justify-content:center;background:var(--zp-accent-900);position:relative;overflow:hidden}
.stars{position:absolute;inset:0;opacity:.3;background-image:var(--zp-starfield)}
.mark{position:relative;height:540px}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}</style></head><body>
<div class="main"><div class="stars"></div><img class="mark" src="assets/logo/accent/F02-accent-400-white.svg" alt="Zerpy"></div>
<div class="strip">
<span style="background:var(--zp-accent-300)"></span>
<span style="background:var(--zp-cat-3)"></span>
<span style="background:var(--zp-cat-2)"></span>
<span style="background:var(--zp-cat-5)"></span>
</div>
</body></html>
