<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Four semantic hues — the only colors that carry meaning" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{height:52px;border-radius:var(--zp-radius);border:1px solid var(--zp-line)}
.lab{display:flex;flex-direction:column;gap:1px;min-width:0}
.lab b{font:var(--zp-text-label);color:var(--zp-text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--zp-success)"></div><div class="lab"><b>--zp-success</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-warning)"></div><div class="lab"><b>--zp-warning</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-danger)"></div><div class="lab"><b>--zp-danger</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-info)"></div><div class="lab"><b>--zp-info</b><span class="hx"></span></div></div></div><div class="hx" style="margin-top:8px">Green is confirmed · amber is pending · red is failed or destructive · blue is informational</div></body></html>
