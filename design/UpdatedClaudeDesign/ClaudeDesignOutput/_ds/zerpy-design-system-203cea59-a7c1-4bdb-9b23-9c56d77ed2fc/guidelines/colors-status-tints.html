<!-- @dsCard group="Colors" viewport="700x140" name="Status in use" subtitle="Each hue with its 16% tint and border — how a badge is built" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
</style></head><body><div class="row" style="gap:12px">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--zp-radius);border:1px solid var(--zp-success-line);background:var(--zp-success-tint);font:var(--zp-text-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--zp-success)"><span style="width:5px;height:5px;border-radius:50%;background:var(--zp-success);box-shadow:0 0 8px var(--zp-success)"></span>Confirmed</span><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--zp-radius);border:1px solid var(--zp-warning-line);background:var(--zp-warning-tint);font:var(--zp-text-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--zp-warning)"><span style="width:5px;height:5px;border-radius:50%;background:var(--zp-warning);box-shadow:0 0 8px var(--zp-warning)"></span>Tentative</span><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--zp-radius);border:1px solid var(--zp-danger-line);background:var(--zp-danger-tint);font:var(--zp-text-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--zp-danger)"><span style="width:5px;height:5px;border-radius:50%;background:var(--zp-danger);box-shadow:0 0 8px var(--zp-danger)"></span>Withdrawn</span><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--zp-radius);border:1px solid var(--zp-info-line);background:var(--zp-info-tint);font:var(--zp-text-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--zp-info)"><span style="width:5px;height:5px;border-radius:50%;background:var(--zp-info);box-shadow:0 0 8px var(--zp-info)"></span>Timewalking</span>
</div><div class="hx" style="margin-top:12px">A 5px glowing dot plus an uppercase mono label on a 16% tint. Status is never carried by a rail, and identity is never carried by a badge.</div></body></html>
