<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Translucent white tints — a surface never has a solid fill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{height:52px;border-radius:var(--zp-radius);border:1px solid var(--zp-line)}
.lab{display:flex;flex-direction:column;gap:1px;min-width:0}
.lab b{font:var(--zp-text-label);color:var(--zp-text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div style="background:var(--zp-ground);padding:14px;border-radius:var(--zp-radius)">
<div class="row"><div class="sw"><div class="chip" style="background:var(--zp-surface-1)"></div><div class="lab"><b>--zp-surface-1</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-surface-2)"></div><div class="lab"><b>--zp-surface-2</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-surface-3)"></div><div class="lab"><b>--zp-surface-3</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-surface-panel)"></div><div class="lab"><b>--zp-surface-panel</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-surface-overlay)"></div><div class="lab"><b>--zp-surface-overlay</b><span class="hx"></span></div></div><div class="sw"><div class="chip" style="background:var(--zp-surface-field)"></div><div class="lab"><b>--zp-surface-field</b><span class="hx"></span></div></div></div>
</div><div class="hx" style="margin-top:8px">2.8% · 4.5% · 7% white · top-lit panel gradient · near-opaque overlay · recessed field well</div></body></html>
