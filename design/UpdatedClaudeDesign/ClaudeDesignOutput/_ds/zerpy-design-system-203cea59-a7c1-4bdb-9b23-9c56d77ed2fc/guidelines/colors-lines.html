<!-- @dsCard group="Colors" viewport="700x140" name="Lines" subtitle="Three border weights plus the fading rule used inside dense grids" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
</style></head><body><div class="col" style="gap:16px">
<div class="col" style="gap:5px"><span class="mi">--zp-line · dividers</span><div style="height:1px;background:var(--zp-line)"></div></div>
<div class="col" style="gap:5px"><span class="mi">--zp-line-strong · control edges</span><div style="height:1px;background:var(--zp-line-strong)"></div></div>
<div class="col" style="gap:5px"><span class="mi">--zp-line-accent · active, selected</span><div style="height:1px;background:var(--zp-line-accent)"></div></div>
<div class="col" style="gap:5px"><span class="mi">--zp-rule-fade · rules inside a grid</span><div style="height:1px;background:var(--zp-rule-fade)"></div></div>
</div></body></html>
