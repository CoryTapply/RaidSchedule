<!-- @dsCard group="Colors" viewport="700x150" name="Ground" subtitle="The page floor and the layered radial wash every full view sits on" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{height:52px;border-radius:var(--zp-radius);border:1px solid var(--zp-line)}
.lab{display:flex;flex-direction:column;gap:1px;min-width:0}
.lab b{font:var(--zp-text-label);color:var(--zp-text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.big{height:96px;border-radius:var(--zp-radius);border:1px solid var(--zp-line);position:relative;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;opacity:var(--zp-starfield-opacity);background-image:var(--zp-starfield)}</style></head><body><div class="row" style="align-items:flex-start">
<div class="sw" style="flex:2"><div class="big" style="background:var(--zp-ground)"><div class="stars"></div></div><div class="lab"><b>--zp-ground + --zp-starfield</b><span class="hx">two purple washes over a vertical gradient, starfield at 30%</span></div></div>
<div class="sw"><div class="chip" style="height:96px;background:var(--zp-bg-lifted)"></div><div class="lab"><b>--zp-bg-lifted</b><span class="hx">#0d0e18</span></div></div>
<div class="sw"><div class="chip" style="height:96px;background:var(--zp-bg-raised)"></div><div class="lab"><b>--zp-bg-raised</b><span class="hx">#0b0c14</span></div></div>
<div class="sw"><div class="chip" style="height:96px;background:var(--zp-bg)"></div><div class="lab"><b>--zp-bg</b><span class="hx">#08080f</span></div></div>
</div></body></html>
