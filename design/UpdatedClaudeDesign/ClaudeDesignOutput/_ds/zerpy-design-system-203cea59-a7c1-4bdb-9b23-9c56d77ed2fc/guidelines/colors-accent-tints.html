<!-- @dsCard group="Colors" viewport="700x170" name="Accent in use" subtitle="The accent almost never appears as a fill — it is a tint, a border and a glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{height:52px;border-radius:var(--zp-radius);border:1px solid var(--zp-line)}
.lab{display:flex;flex-direction:column;gap:1px;min-width:0}
.lab b{font:var(--zp-text-label);color:var(--zp-text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><div class="row" style="align-items:stretch">
<div class="sw"><div class="chip" style="height:64px;background:var(--zp-accent-tint);border-color:var(--zp-line-accent)"></div><div class="lab"><b>--zp-accent-tint</b><span class="hx">16% · resting</span></div></div>
<div class="sw"><div class="chip" style="height:64px;background:var(--zp-accent-tint-strong);border-color:var(--zp-line-accent)"></div><div class="lab"><b>--zp-accent-tint-strong</b><span class="hx">28% · hover</span></div></div>
<div class="sw"><div class="chip" style="height:64px;background:var(--zp-accent-tint);border-color:var(--zp-line-accent);box-shadow:var(--zp-accent-glow)"></div><div class="lab"><b>--zp-accent-glow</b><span class="hx">the primary button</span></div></div>
<div class="sw" style="flex:1.4"><div class="chip" style="height:64px;display:flex;align-items:center;justify-content:center;background:none;border-color:transparent"><span style="font:var(--zp-text-h2);background:var(--zp-gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent">Gradient text</span></div><div class="lab"><b>--zp-gradient-text</b><span class="hx">display titles only, one per screen</span></div></div>
</div></body></html>
