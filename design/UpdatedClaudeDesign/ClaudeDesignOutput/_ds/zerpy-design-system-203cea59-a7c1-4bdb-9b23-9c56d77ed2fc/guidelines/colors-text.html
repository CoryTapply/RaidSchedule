<!-- @dsCard group="Colors" viewport="700x160" name="Text" subtitle="Four steps of quiet, from full white down to 45%" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:16px;background:var(--zp-bg);color:var(--zp-text);font-family:var(--zp-font-body);box-sizing:border-box}
.mi{font:var(--zp-text-micro);letter-spacing:var(--zp-tracking-micro);text-transform:uppercase;color:var(--zp-text-4)}
.hx{font:var(--zp-text-micro);color:var(--zp-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
a{color:var(--zp-accent-400);text-decoration:none}a:hover{color:var(--zp-accent-300)}
</style></head><body><div class="col" style="gap:9px">
<div style="font:var(--zp-text-lg);color:var(--zp-text)">--zp-text · #f2f1fb — headings, values, the thing you came for</div>
<div style="font:var(--zp-text-lg);color:var(--zp-text-2)">--zp-text-2 · 78% — body copy and control labels</div>
<div style="font:var(--zp-text-lg);color:var(--zp-text-3)">--zp-text-3 · 60% — descriptions and secondary lines</div>
<div style="font:var(--zp-text-lg);color:var(--zp-text-4)">--zp-text-4 · 45% — micro-labels, hints, disabled</div>
</div></body></html>
